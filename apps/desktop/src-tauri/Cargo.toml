[package]
name = "erp-system"
version = "0.0.0"
description = "A Tauri App"
edition = "2024"


[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
wmi = "0.14"
